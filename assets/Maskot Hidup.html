<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Maskot Hidup</title><style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#F3F6FA;--card:#fff;--text:#0F1B33;--muted:#4A5670;--chip:#E3EAF4;--primary:#2563EB;--stage:#DBEAFE;color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1A33;--card:#13264A;--text:#EAF1FF;--muted:#A9B8D6;--chip:#1E3560;--primary:#5B93FF;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B1A33;--card:#13264A;--text:#EAF1FF;--muted:#A9B8D6;--chip:#1E3560;--primary:#5B93FF;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;display:flex;justify-content:center;padding:20px 16px 32px}
main{width:100%;max-width:420px}
h1{font-size:22px;margin:0 0 4px} p{margin:0;color:var(--muted);font-size:14px;line-height:1.5}
.card{background:var(--card);border-radius:20px;padding:16px;margin-top:16px}
.stage{position:relative;height:360px;border-radius:20px;background:var(--stage);overflow:hidden;display:flex;align-items:flex-end;justify-content:center}
#wrap{width:290px;margin-bottom:6px;cursor:pointer;transform-origin:50% 100%;-webkit-tap-highlight-color:transparent}
#bear{width:100%;height:auto;display:block;overflow:visible}
#bear *{transform-box:fill-box}
#body{transform-origin:50% 100%;animation:breathe 3.6s ease-in-out infinite}
[data-eyes="sleep"] #body{animation-duration:6s}
@keyframes breathe{0%,100%{transform:scale(1,1) rotate(-.8deg)}50%{transform:scale(1.015,1.03) rotate(.8deg)}}
.eyeO{transform-origin:50% 50%;transition:transform .2s}
.eyeB{transform-origin:50% 50%}
.blink .eyeB{animation:blink .17s ease-in-out}
@keyframes blink{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.05)}}
.blink #arcSleep{display:block;animation:lash .17s ease-in-out}
@keyframes lash{0%,30%,100%{opacity:0}50%{opacity:1}}
.br{transition:transform .25s;transform-origin:50% 50%}
[data-brows="up"] .br{transform:translateY(-16px)}
[data-brows="sad"] #browL{transform:rotate(-20deg) translateY(4px)}
[data-brows="sad"] #browR{transform:rotate(20deg) translateY(4px)}
[data-brows="down"] .br{transform:translateY(6px)}
#fxSparkle,.arc,#blush,#mOpen,#mO,#mSad,#mTiny,#zzz{display:none}
[data-eyes="happy"] #eyes,[data-eyes="sleep"] #eyes{display:none}
[data-eyes="happy"] #arcHappy,[data-eyes="sleep"] #arcSleep{display:block}
.arc{fill:none;stroke:#673A40;stroke-width:13;stroke-linecap:round}
[data-eyes="wide"] .eyeO{transform:scale(1.1)}
[data-fx~="sparkle"] #fxSparkle,[data-fx~="blush"] #blush{display:block}
[data-eyes="sleep"] #zzz{display:block}
[data-mouth="open"] #mSmile,[data-mouth="o"] #mSmile,[data-mouth="sad"] #mSmile,[data-mouth="tiny"] #mSmile{display:none}
[data-mouth="open"] #mOpen,[data-mouth="o"] #mO,[data-mouth="sad"] #mSad,[data-mouth="tiny"] #mTiny{display:block}
.z{opacity:0;animation:zfloat 3s ease-in infinite}.z2{animation-delay:1s}.z3{animation-delay:2s}
@keyframes zfloat{0%{opacity:0;transform:translate(0,14px)}30%{opacity:1}100%{opacity:0;transform:translate(10px,-26px)}}
.jump{animation:jump .7s ease-out 2}
@keyframes jump{0%{transform:translateY(0) scale(1,1)}15%{transform:scale(1.05,.94)}50%{transform:translateY(-40px) scale(.98,1.04)}85%{transform:scale(1.04,.95)}100%{transform:translateY(0) scale(1,1)}}
.squish{animation:squish .4s ease-out}
@keyframes squish{0%{transform:scale(1)}35%{transform:scale(1.07,.92)}70%{transform:scale(.98,1.04)}100%{transform:scale(1)}}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{border:0;background:var(--chip);color:var(--text);font:inherit;font-weight:700;font-size:13px;padding:10px 14px;border-radius:99px;min-height:40px;cursor:pointer}
.chip.sel{background:var(--primary);color:#fff}
.lab{font-size:13px;font-weight:700;color:var(--muted)}
@media (prefers-reduced-motion:reduce){#body,.blink .eyeB,.z,.jump,.squish{animation:none}}
</style></head><body><main>

<div class="card"><div class="lab">Yang bergerak</div><p style="margin-top:6px">Mata berkedip otomatis, alis naik dan turun, mulut berganti saat bicara, badan bernapas, dan ekspresi berubah. Telinga dan lengan belum bergerak.</p></div>
</main><script>
var S={"normal": {"eyes": "open", "mouth": "smile", "brows": "normal", "fx": ""}, "happy": {"eyes": "happy", "mouth": "open", "brows": "normal", "fx": "blush"}, "sparkle": {"eyes": "open", "mouth": "open", "brows": "up", "fx": "sparkle"}, "surprised": {"eyes": "wide", "mouth": "o", "brows": "up", "fx": ""}, "sad": {"eyes": "open", "mouth": "sad", "brows": "sad", "fx": ""}, "sleep": {"eyes": "sleep", "mouth": "tiny", "brows": "down", "fx": ""}};
var bear=document.getElementById('bear'),wrap=document.getElementById('wrap');
var cur='normal',talking=false,tt=null;
function apply(k){cur=k;var s=S[k];bear.dataset.eyes=s.eyes;bear.dataset.mouth=s.mouth;bear.dataset.brows=s.brows;bear.dataset.fx=s.fx;
 document.querySelectorAll('.chip[data-s]').forEach(function(c){c.classList.toggle('sel',c.dataset.s===k)});
 if(k==='happy'||k==='sparkle')anim('jump',1400);}
function anim(c,ms){wrap.classList.remove('jump','squish');void wrap.offsetWidth;wrap.classList.add(c);setTimeout(function(){wrap.classList.remove(c)},ms)}
function blink(){if(bear.dataset.eyes==='open'||bear.dataset.eyes==='wide'){bear.classList.remove('blink');void bear.getBoundingClientRect();bear.classList.add('blink');setTimeout(function(){bear.classList.remove('blink')},200)}}
function sched(){setTimeout(function(){blink();if(Math.random()<.25)setTimeout(blink,260);sched()},2200+Math.random()*3000)}
function talkLoop(){if(!talking)return;var m=['open','smile','open','o','smile'][Math.floor(Math.random()*5)];bear.dataset.mouth=m;tt=setTimeout(talkLoop,110+Math.random()*130)}
document.getElementById('talk').addEventListener('click',function(){talking=!talking;this.classList.toggle('sel',talking);clearTimeout(tt);if(talking)talkLoop();else bear.dataset.mouth=S[cur].mouth});
document.getElementById('blinkBtn').addEventListener('click',blink);
document.querySelectorAll('.chip[data-s]').forEach(function(c){c.addEventListener('click',function(){apply(c.dataset.s);if(talking){clearTimeout(tt);talkLoop()}})});
wrap.addEventListener('click',function(){if(cur!=='sleep')anim('squish',400);blink()});
apply('normal');sched();
</script></body></html>
